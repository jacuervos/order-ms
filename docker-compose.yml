version: '3.8'

services:
  order-db:
    image: postgres:latest
    container_name: order-ms
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order-ms
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_order:/var/lib/postgresql/data

volumes:
  postgres_data_order:
